[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uptible-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["keyring>=25,<26", "filelock>=3.16,<4"]

[project.scripts]
uptible = "uptible_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
