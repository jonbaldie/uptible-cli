[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "uptible-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26", "filelock>=4.2.10,<5"]

[project.scripts]
uptible = "uptible_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
