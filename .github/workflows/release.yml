name: Release

# A v* tag publishes a GitHub release. Pull requests run the same build and
# formula rendering without publishing, so the release path is proven before a tag.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Read the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
      - name: Build and verify installed wheel
        run: python scripts/verify-artifact.py "$RUNNER_TEMP/dist"
      - name: Render the Homebrew formula
        run: |
          python scripts/homebrew-formula.py --version "$VERSION" --sdist "$RUNNER_TEMP/dist/uptible_cli-$VERSION.tar.gz" > "$RUNNER_TEMP/uptible.rb"
          ruby -c "$RUNNER_TEMP/uptible.rb"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/dist/
            ${{ runner.temp }}/uptible.rb
          if-no-files-found: error
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "uptible $VERSION" --generate-notes \
            "$RUNNER_TEMP"/dist/*.whl "$RUNNER_TEMP"/dist/*.tar.gz \
            "$RUNNER_TEMP/dist/SHA256SUMS" "$RUNNER_TEMP/dist/SOURCE_REVISION" "$RUNNER_TEMP/uptible.rb"
