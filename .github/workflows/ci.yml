name: Verify installable artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify installed wheel
        run: python scripts/verify-artifact.py "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v6
        with:
          name: verified-python-${{ matrix.python }}
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
